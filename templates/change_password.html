<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PowerDataChat — Set a new password</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
         background: #e8f0fa; margin: 0; min-height: 100vh;
         display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 10px; padding: 40px 36px;
          width: 380px; box-shadow: 0 6px 20px rgba(0,30,68,0.08); }
  .logo { display: block; margin: 0 auto 20px; width: 56px; }
  h1 { margin: 0 0 6px; font-size: 20px; color: #001E44; text-align: center; }
  p.sub { margin: 0 0 26px; color: #6b7280; font-size: 14px; text-align: center; }
  label { font-size: 12px; color: #4b5563; }
  .field { margin-top: 14px; }
  .field:first-of-type { margin-top: 0; }
  input[type=password] { width: 100%; padding: 11px 13px; border: 1px solid #d1d5db;
          border-radius: 7px; margin-top: 5px; font-size: 15px;
          box-sizing: border-box; }
  input:focus { outline: 2px solid #1276C2; outline-offset: 0; }
  button { width: 100%; margin-top: 18px; padding: 12px; background: #1276C2;
           color: #fff; border: 0; border-radius: 7px; font-size: 15px;
           cursor: pointer; font-weight: 500; }
  button:hover { background: #0d5d99; }
  .error { color: #dc2626; font-size: 13px; margin-top: 10px; text-align: center; }
  .footer { margin-top: 18px; font-size: 11px; color: #9ca3af; text-align: center; }
</style>
</head>
<body>
  <form class="card" method="post" action="/auth/change_password">
    <img src="/static/logo2.png" alt="PowerDataChat" class="logo" />
    <h1>Set a new password</h1>
    <p class="sub">You signed in with a temporary password.<br>
       Choose a new password for <strong>{{ email }}</strong> to continue.</p>
    <div class="field">
      <label for="new_password">New password</label>
      <input id="new_password" name="new_password" type="password"
             autocomplete="new-password" required autofocus />
    </div>
    <div class="field">
      <label for="confirm_password">Confirm new password</label>
      <input id="confirm_password" name="confirm_password" type="password"
             autocomplete="new-password" required />
    </div>
    <button type="submit">Save and continue</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <div class="footer">Enterprise · on-premise deployment</div>
  </form>
</body>
</html>
