# LOCAL TESTING stack — client half.
#
# This file is for PowerDataChat's LOCAL testing only. Customers use the
# plain docker-compose.yml (image-only, client.env) — that file is untouched
# by local development. Here the image is BUILT from this repo, mirroring a
# production client upgrade: new image, same data.
#
# STANDING RULE (see docs/BUILD_AND_RUN.md §3): local testing always runs
# through this Docker stack against the PERSISTENT `pdc_client_*` volumes,
# so real users, chats, and conversation history are exercised exactly like
# a production redeploy. The volumes are declared EXTERNAL and must never be
# removed — do NOT run `docker compose down -v` and back up the volume
# contents before a rebuild.
#
# The local brain runs as its own compose project from the PDC_Brain repo on
# port 8090; this client reaches it over a URL (host.docker.internal), the
# same shape as a customer reaching the hosted brain.
#
# Usage:
#   cp client.local.env.example client.local.env    # fill in once
#   docker compose -f docker-compose.local.yml up -d --build
#
# Stamp the build so /version and the admin sidebar identify it (PowerShell):
#   $env:BUILD_COMMIT = git rev-parse --short HEAD
#   $env:BUILD_TIME   = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mmZ")
#   docker compose -f docker-compose.local.yml up -d --build
# Unset -> an unstamped image that honestly reports its start time instead
# of a commit (a placeholder like "dev" would just be a different lie).
# NEVER read the static ?v=
# parameter as a build marker: it is the page-render clock, per request.

services:
  client:
    build:
      context: .
      args:
        BUILD_COMMIT: "${BUILD_COMMIT:-}"
        BUILD_TIME: "${BUILD_TIME:-}"
    image: powerdatachat-client:enterprise
    container_name: pdc-client
    env_file:
      - client.local.env
      # Optional overlay: `.env` is dockerignored (never baked into the
      # image), so vars kept there (CLIENT_ENCRYPTION_KEY,
      # LOCAL_ADMIN_PASSWORD, ...) reach the container this way. Later files
      # override earlier ones.
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8091:8000"
    environment:
      # The local stack is plain HTTP on a host port, so the Secure session
      # cookie has to be off or the browser drops it.
      - SESSION_HTTPS_ONLY=false
    volumes:
      - pdc_client_data:/data/client
      # The log now lives at /data/client/logs on the data volume, so the old
      # pdc_client_logs mount is gone. That host volume is LEFT IN PLACE (it
      # still holds previous logs) and must never be deleted — it is simply
      # unused from here on.
    # Hardening, identical to the customer file: the container's own filesystem
    # is READ-ONLY, all state lives on the data volume above, and /tmp is the
    # only writable scratch space (matplotlib + fontconfig caches, kaleido's
    # headless Chromium, temp files) on a tmpfs that a restart wipes. Every
    # capability is dropped, privilege escalation is blocked, memory and
    # process counts are bounded.
    read_only: true
    # NOTE ON SIZE: /tmp also carries multipart UPLOAD spooling — Starlette
    # writes any upload part over 1 MiB to a temp file — so this cap is the
    # ceiling on the bytes of one in-flight upload batch, not just on caches.
    # It is RAM-backed and counted against mem_limit, so raise BOTH together
    # for installs that ingest very large files.
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    pids_limit: 512
    # cpus: "2.0"   # uncomment to cap CPU
    restart: unless-stopped

volumes:
  # EXTERNAL — pre-existing volume holding all user data + history. Compose
  # must never create or delete it. (The former pdc_client_logs volume is no
  # longer declared or mounted: logs live at /data/client/logs on this volume.
  # The host volume is left in place and never deleted.)
  pdc_client_data:
    external: true
